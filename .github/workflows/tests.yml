name: Python Tests

on:
  push:
    branches: [ "main", "logic" ]
  pull_request:
    branches: [ "main", "logic" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx  # Устанавливаем инструменты тестирования

      - name: Run tests with pytest
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: CI_SECRET_KEY_FOR_TESTS_ONLY
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_DAYS: 1
        run: |
          pytest